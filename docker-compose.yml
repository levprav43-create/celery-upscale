services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    build: .
    command: celery -A tasks worker --loglevel=info
    environment:
      REDIS_URL: redis://redis:6379/0
      C_FORCE_ROOT: "true"
    depends_on:
      - redis

  web:
    build: .
    command: python main.py
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5000:5000"
    depends_on:
      - redis
      - worker